<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced To-Do List App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(120deg, #89f7fe, #66a6ff);
            color: #333;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #6c63ff;
            margin-bottom: 30px;
        }
        .btn {
            border-radius: 50px;
        }
        .list-group-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .priority-high {
            color: #ff4d4d;
        }
        .priority-medium {
            color: #ffc107;
        }
        .priority-low {
            color: #28a745;
        }
        .completed-task {
            text-decoration: line-through;
            color: #aaa;
        }
        .progress {
            height: 20px;
            margin-bottom: 20px;
        }
        .task-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .task-stats div {
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enhanced To-Do List App</h1>
        <div class="task-stats">
            <div>
                <h5>Pending Tasks</h5>
                <p id="pendingCount">0</p>
            </div>
            <div>
                <h5>Completed Tasks</h5>
                <p id="completedCount">0</p>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4">
                <form id="taskForm">
                    <div class="form-group mb-3">
                        <label for="title">Title</label>
                        <input type="text" class="form-control" id="title" placeholder="Task title" required>
                    </div>
                    <div class="form-group mb-3">
                        <label for="description">Description</label>
                        <textarea class="form-control" id="description" rows="3" placeholder="Task description" required></textarea>
                    </div>
                    <div class="form-group mb-3">
                        <label for="priority">Priority</label>
                        <select id="priority" class="form-control">
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Add Task</button>
                </form>
            </div>
            <div class="col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3>Tasks</h3>
                    <input type="text" id="searchTask" class="form-control w-50" placeholder="Search tasks...">
                </div>
                <div class="progress">
                    <div id="progressBar" class="progress-bar bg-success" role="progressbar" style="width: 0%;">0%</div>
                </div>
                <ul id="taskList" class="list-group"></ul>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadTasks);
        const taskForm = document.getElementById('taskForm');
        const searchTask = document.getElementById('searchTask');

        taskForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const priority = document.getElementById('priority').value;

            if (title && description) {
                addTask(title, description, priority);
                saveTasks();
                taskForm.reset();
                updateStats();
                updateProgress();
            }
        });

        searchTask.addEventListener('input', function () {
            const query = searchTask.value.toLowerCase();
            document.querySelectorAll('#taskList .list-group-item').forEach(task => {
                const title = task.querySelector('.task-title').innerText.toLowerCase();
                task.style.display = title.includes(query) ? 'flex' : 'none';
            });
        });

        function addTask(title, description, priority, isCompleted = false) {
            const taskItem = document.createElement('li');
            taskItem.className = list-group-item ${isCompleted ? 'completed-task' : ''};
            taskItem.innerHTML = `
                <div>
                    <strong class="task-title">${title}</strong> 
                    <span class="badge ${getPriorityClass(priority)}">${priority}</span>
                    <p>${description}</p>
                </div>
                <div>
                    <button class="btn btn-success btn-sm me-2" onclick="toggleComplete(this)">✔</button>
                    <button class="btn btn-danger btn-sm me-2" onclick="deleteTask(this)">✖</button>
                </div>
            `;
            document.getElementById('taskList').appendChild(taskItem);
        }

        function toggleComplete(button) {
            const taskItem = button.closest('.list-group-item');
            taskItem.classList.toggle('completed-task');
            saveTasks();
            updateStats();
            updateProgress();
        }

        function deleteTask(button) {
            const taskItem = button.closest('.list-group-item');
            taskItem.remove();
            saveTasks();
            updateStats();
            updateProgress();
        }

        function getPriorityClass(priority) {
            return priority === 'High' ? 'priority-high' : priority === 'Medium' ? 'priority-medium' : 'priority-low';
        }

        function saveTasks() {
            const tasks = [];
            document.querySelectorAll('#taskList .list-group-item').forEach(task => {
                const title = task.querySelector('.task-title').innerText;
                const description = task.querySelector('p').innerText;
                const priority = task.querySelector('.badge').innerText;
                const isCompleted = task.classList.contains('completed-task');
                tasks.push({ title, description, priority, isCompleted });
            });
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function loadTasks() {
            const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            tasks.forEach(task => addTask(task.title, task.description, task.priority, task.isCompleted));
            updateStats();
            updateProgress();
        }

        function updateStats() {
            const tasks = document.querySelectorAll('#taskList .list-group-item').length;
            const completedTasks = document.querySelectorAll('#taskList .completed-task').length;
            const pendingTasks = tasks - completedTasks;

            document.getElementById('pendingCount').innerText = pendingTasks;
            document.getElementById('completedCount').innerText = completedTasks;
        }

        function updateProgress() {
            const tasks = document.querySelectorAll('#taskList .list-group-item').length;
            const completedTasks = document.querySelectorAll('#taskList .completed-task').length;
            const progress = tasks > 0 ? (completedTasks / tasks) * 100 : 0;

            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = ${progress}%;
            progressBar.innerText = ${Math.round(progress)}%;

            progressBar.className = 'progress-bar';
            if (progress < 50) progressBar.classList.add('bg-danger');
            else if (progress < 75) progressBar.classList.add('bg-warning');
            else progressBar.classList.add('bg-success');
        }
    </script>
</body>
</html>
